<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometria Master</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- HTML2PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Tailwind Config for Custom Animations -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-indigo-500 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-400 via-indigo-600 to-indigo-900 font-sans selection:bg-pink-400 selection:text-white">
    
    <!-- Header (Hidden on Intro) -->
    <div id="header-container" class="hidden"></div>

    <!-- Main Content Area -->
    <main id="app-container" class="pt-4 pb-12"></main>

    <script>
        // --- CONFIGURAÇÕES DE GAMIFICAÇÃO ---
        const RANKS = [
            { name: 'Bronze', minXp: 0, color: 'text-orange-700', bg: 'bg-orange-100', border: 'border-orange-700', shadow: 'shadow-orange-900/50' },
            { name: 'Prata', minXp: 150, color: 'text-slate-400', bg: 'bg-slate-100', border: 'border-slate-400', shadow: 'shadow-slate-500/50' },
            { name: 'Ouro', minXp: 300, color: 'text-yellow-500', bg: 'bg-yellow-100', border: 'border-yellow-500', shadow: 'shadow-yellow-600/50' },
            { name: 'Platina', minXp: 450, color: 'text-cyan-600', bg: 'bg-cyan-100', border: 'border-cyan-600', shadow: 'shadow-cyan-700/50' },
            { name: 'Diamante', minXp: 600, color: 'text-blue-500', bg: 'bg-blue-100', border: 'border-blue-500', shadow: 'shadow-blue-600/50' },
            { name: 'Rubi', minXp: 750, color: 'text-rose-600', bg: 'bg-rose-100', border: 'border-rose-600', shadow: 'shadow-rose-700/50' },
        ];

        const XP_CORRECT = 15;
        const XP_WRONG = -5;

        // --- DADOS DO JOGO ---
        const GAME_DATA = [
            {
                id: 'figura_plana',
                title: 'Figura Plana',
                color: 'from-blue-400 to-blue-600',
                icon: '📏',
                questions: [
                    { text: "O que caracteriza uma Figura Plana?", options: ["Possui apenas duas dimensões: comprimento e largura.", "Possui três dimensões, incluindo profundidade.", "É qualquer linha desenhada no papel.", "Possui sempre volume."], correct: 0 },
                    { text: "Verdadeiro ou Falso: Um desenho de um triângulo numa folha de papel é uma figura plana.", options: ["Verdadeiro", "Falso"], correct: 0 },
                    { text: "Exercício: Se desenhar o contorno da sua mão no caderno, criou uma...", options: ["Figura Não Plana", "Figura Espacial", "Figura Plana", "Figura com Volume"], correct: 2 },
                    { text: "Qual das alternativas abaixo representa uma figura plana?", options: ["Uma bola de futebol", "Uma caixa de sapatos", "Uma folha de papel", "Um dado de jogar"], correct: 2 },
                    { text: "As figuras planas são chamadas de bidimensionais porque possuem:", options: ["1 dimensão", "2 dimensões", "3 dimensões", "4 dimensões"], correct: 1 },
                    { text: "Identifique a figura plana:", options: ["Cubo", "Esfera", "Círculo", "Pirâmide"], correct: 2 },
                    { text: "Situação: O João quer calcular a área do chão do seu quarto. O chão é considerado uma figura:", options: ["Plana, pois ele quer saber a superfície.", "Não plana, pois tem paredes.", "Espacial, pois ele caminha sobre ele.", "Unidimensional."], correct: 0 }
                ]
            },
            {
                id: 'figura_nao_plana',
                title: 'Figura Não Plana',
                color: 'from-purple-400 to-purple-600',
                icon: '📦',
                questions: [
                    { text: "O que caracteriza uma Figura Não Plana (Espacial)?", options: ["Possui apenas 2 dimensões.", "Não ocupa lugar no espaço.", "Possui 3 dimensões: comprimento, largura e profundidade/altura.", "É sempre formada por linhas curvas."], correct: 2 },
                    { text: "Qual objeto do dia a dia é um ótimo exemplo de figura não plana?", options: ["Um tapete bem fino", "Uma fotografia", "Uma lata de refrigerante", "A tela do celular desligada"], correct: 2 },
                    { text: "Verdadeiro ou Falso: Uma figura não plana possui volume.", options: ["Verdadeiro", "Falso"], correct: 0 },
                    { text: "Interativo: Se empilhar vários quadrados (figuras planas) de papel, uns em cima dos outros, o que começa a formar?", options: ["Um triângulo", "Uma figura com volume (não plana)", "Um círculo plano", "Uma linha"], correct: 1 },
                    { text: "Qual destas opções é uma figura geométrica espacial (não plana)?", options: ["Quadrado", "Triângulo", "Cilindro", "Losango"], correct: 2 },
                    { text: "Uma caixa de sapatos lembra qual figura geométrica não plana?", options: ["Paralelepípedo", "Esfera", "Cone", "Pirâmide"], correct: 0 },
                    { text: "Exercício: Qual das características abaixo NÃO pertence às figuras não planas?", options: ["Possuem vértices, arestas e faces.", "Ocupam lugar no espaço.", "Possuem volume.", "Podem ser desenhadas perfeitamente em apenas 2 dimensões reais."], correct: 3 }
                ]
            },
            {
                id: 'poligono',
                title: 'Polígonos',
                color: 'from-emerald-400 to-emerald-600',
                icon: '⬡',
                questions: [
                    { text: "Teoria: O que é um Polígono?", options: ["Uma figura plana, fechada, formada apenas por segmentos de reta que não se cruzam.", "Qualquer figura fechada.", "Uma figura com lados curvos.", "Uma figura em 3D com muitas faces."], correct: 0 },
                    { text: "Um círculo é considerado um polígono?", options: ["Sim, pois é plano e fechado.", "Não, pois possui contorno curvo, e não segmentos de reta.", "Sim, é um polígono infinito.", "Depende do tamanho do círculo."], correct: 1 },
                    { text: "Qual é o menor número de lados que um polígono pode ter?", options: ["1", "2", "3", "4"], correct: 2 },
                    { text: "Como se chama um polígono de 5 lados?", options: ["Hexágono", "Heptágono", "Pentágono", "Octógono"], correct: 2 },
                    { text: "Exercício: Observe a letra 'X' desenhada em linhas retas. É um polígono?", options: ["Sim, pois tem linhas retas.", "Não, pois as linhas cruzam-se no meio.", "Sim, é um polígono em formato de cruz.", "Não, pois não é plana."], correct: 1 },
                    { text: "Os pontos de encontro dos lados de um polígono são chamados de:", options: ["Arestas", "Diagonais", "Faces", "Vértices"], correct: 3 },
                    { text: "Interativo: Um tabuleiro de xadrez possui a forma de um polígono regular de 4 lados. Que polígono é esse?", options: ["Retângulo", "Losango", "Quadrado", "Trapézio"], correct: 2 }
                ]
            },
            {
                id: 'triangulo',
                title: 'Triângulo',
                color: 'from-yellow-400 to-orange-500',
                icon: '△',
                questions: [
                    { text: "Quantos lados, vértices e ângulos internos tem um triângulo?", options: ["4 de cada.", "3 de cada.", "2 lados, 3 vértices e 3 ângulos.", "3 lados, mas 4 ângulos."], correct: 1 },
                    { text: "Um triângulo que possui os três lados com medidas iguais é chamado de:", options: ["Escaleno", "Isósceles", "Equilátero", "Retângulo"], correct: 2 },
                    { text: "Qual a soma das medidas dos ângulos internos de QUALQUER triângulo?", options: ["90 graus", "180 graus", "360 graus", "270 graus"], correct: 1 },
                    { text: "Exercício: Se um triângulo tem dois lados a medir 5 cm e um lado a medir 8 cm, é classificado como:", options: ["Equilátero", "Escaleno", "Isósceles", "Retângulo"], correct: 2 },
                    { text: "É possível construir um triângulo com lados a medir 2cm, 3cm e 10cm? (Dica: Regra da existência do triângulo)", options: ["Sim, perfeitamente.", "Não, pois um lado é maior que a soma dos outros dois.", "Sim, mas será um triângulo muito fino.", "Não, os triângulos só têm lados pares."], correct: 1 },
                    { text: "Como chamamos a um triângulo que possui um ângulo de 90 graus (ângulo reto)?", options: ["Triângulo Obtusângulo", "Triângulo Acutângulo", "Triângulo Retângulo", "Triângulo Equilátero"], correct: 2 },
                    { text: "Interativo: Se o perímetro (soma dos lados) de um triângulo equilátero é 30 cm, quanto mede cada lado?", options: ["5 cm", "10 cm", "15 cm", "30 cm"], correct: 1 }
                ]
            },
            {
                id: 'quadrado',
                title: 'Quadrado',
                color: 'from-red-400 to-red-600',
                icon: '□',
                questions: [
                    { text: "Quais são as características principais e obrigatórias de um quadrado?", options: ["4 lados iguais, independentemente dos ângulos.", "4 ângulos retos, independentemente dos lados.", "4 lados da mesma medida e 4 ângulos retos (90 graus).", "2 lados maiores e 2 menores."], correct: 2 },
                    { text: "Todo o quadrado é um retângulo? (Pense na definição de retângulo: ter 4 ângulos retos)", options: ["Verdadeiro, todo o quadrado tem 4 ângulos retos.", "Falso, quadrado e retângulo não têm relação."], correct: 0 },
                    { text: "Exercício: O perímetro de um quadrado é 20 cm. Qual a medida de cada lado?", options: ["4 cm", "5 cm", "10 cm", "20 cm"], correct: 1 },
                    { text: "Quantas diagonais possui um quadrado?", options: ["1", "2", "3", "4"], correct: 1 },
                    { text: "A soma dos ângulos internos de um quadrado é:", options: ["180 graus", "270 graus", "360 graus", "90 graus"], correct: 2 },
                    { text: "Interativo: Um campo de jogos tem 10m de comprimento e 10m de largura. Qual é o formato geométrico da superfície?", options: ["Retângulo não quadrado", "Losango", "Trapézio", "Quadrado"], correct: 3 },
                    { text: "Qual afirmação é FALSA sobre o quadrado?", options: ["As suas diagonais cruzam-se no ponto médio.", "Tem 4 vértices.", "Apenas os lados opostos são paralelos.", "É um polígono regular."], correct: 2 }
                ]
            },
            {
                id: 'retangulo',
                title: 'Retângulo',
                color: 'from-indigo-400 to-indigo-600',
                icon: '▭',
                questions: [
                    { text: "Qual a principal característica que define um Retângulo?", options: ["Ter 4 lados de tamanhos diferentes.", "Possuir 4 ângulos internos retos (90 graus).", "Ter lados paralelos inclinados.", "Ter a forma de uma pipa."], correct: 1 },
                    { text: "Verdadeiro ou Falso: Todo o retângulo é um quadrado.", options: ["Verdadeiro", "Falso, pois o retângulo pode ter lados de tamanhos diferentes, enquanto o quadrado exige lados iguais."], correct: 1 },
                    { text: "Exercício: Um campo de futebol tem 100m de comprimento e 70m de largura. Qual é o seu perímetro?", options: ["170 metros", "340 metros", "7000 metros", "140 metros"], correct: 1 },
                    { text: "Sobre as diagonais do retângulo, podemos afirmar que:", options: ["Possuem medidas diferentes.", "Não se cruzam.", "Possuem a mesma medida (são congruentes).", "São 4 diagonais no total."], correct: 2 },
                    { text: "A porta da sua sala de aula costuma ter o formato de qual polígono?", options: ["Losango", "Trapézio", "Retângulo", "Triângulo"], correct: 2 },
                    { text: "Quantos pares de lados paralelos tem um retângulo?", options: ["Nenhum", "1 par", "2 pares", "3 pares"], correct: 2 },
                    { text: "Interativo: Se dobrar um retângulo exatamente ao meio, unindo os lados opostos, a marca da dobra forma ângulos de quantos graus com a base?", options: ["45 graus", "60 graus", "90 graus", "180 graus"], correct: 2 }
                ]
            },
            {
                id: 'losango',
                title: 'Losango',
                color: 'from-teal-400 to-teal-600',
                icon: '◇',
                questions: [
                    { text: "O que define essencialmente um Losango?", options: ["Ter 4 lados com a mesma medida (congruentes).", "Ter 4 ângulos retos.", "Ter apenas 1 par de lados paralelos.", "Ter o formato de um triângulo virado do avesso."], correct: 0 },
                    { text: "A bandeira do Brasil possui uma figura geométrica amarela no centro. Que figura é essa?", options: ["Retângulo", "Losango", "Círculo", "Paralelogramo qualquer"], correct: 1 },
                    { text: "Qual é a principal diferença entre um losango e um quadrado?", options: ["O losango não tem lados iguais.", "O losango não precisa de ter os ângulos internos retos (90º), o quadrado sim.", "O quadrado tem 5 lados e o losango 4.", "Não há diferença, são a mesma coisa."], correct: 1 },
                    { text: "Verdadeiro ou Falso: As diagonais de um losango cruzam-se formando um ângulo reto (90º).", options: ["Verdadeiro", "Falso"], correct: 0 },
                    { text: "Exercício: Se um losango tem lados a medir 6 cm, qual é o seu perímetro?", options: ["12 cm", "18 cm", "24 cm", "36 cm"], correct: 2 },
                    { text: "O losango é classificado como um:", options: ["Triângulo", "Quadrilátero", "Pentágono", "Polígono não plano"], correct: 1 },
                    { text: "Interativo: Ao desenhar uma pipa clássica, geralmente desenha duas varetas cruzadas (diagonais) e liga as pontas. A forma gerada é um:", options: ["Losango", "Retângulo", "Trapézio", "Círculo"], correct: 0 }
                ]
            },
            {
                id: 'trapezio',
                title: 'Trapézio',
                color: 'from-pink-400 to-pink-600',
                icon: '⏢',
                questions: [
                    { text: "O que define um Trapézio no estudo dos polígonos?", options: ["Possuir dois pares de lados paralelos.", "Possuir apenas UM par de lados paralelos (chamados de bases).", "Não possuir nenhum lado paralelo.", "Ter todos os lados de medidas iguais."], correct: 1 },
                    { text: "Como chamamos os lados paralelos do trapézio?", options: ["Pernas", "Lados oblíquos", "Base maior e Base menor", "Diagonais"], correct: 2 },
                    { text: "Um trapézio que possui dois lados não-paralelos com a MESMA medida é chamado de:", options: ["Trapézio Retângulo", "Trapézio Isósceles", "Trapézio Escaleno", "Losango"], correct: 1 },
                    { text: "Verdadeiro ou Falso: Um trapézio retângulo tem dois ângulos retos (90º).", options: ["Verdadeiro", "Falso"], correct: 0 },
                    { text: "Exercício: A base maior de um trapézio mede 10cm, a base menor mede 6cm e os outros dois lados medem 5cm cada. Qual o perímetro?", options: ["21 cm", "26 cm", "30 cm", "16 cm"], correct: 1 },
                    { text: "Quantos vértices possui um trapézio?", options: ["3", "4", "5", "6"], correct: 1 },
                    { text: "Interativo: O formato de uma saia ou da lateral de um abajur clássico lembra muito qual polígono?", options: ["Quadrado", "Círculo", "Trapézio", "Triângulo retângulo"], correct: 2 }
                ]
            }
        ];

        // --- ESTADO GLOBAL ---
        let gameState = 'intro'; // intro, map, playing, report
        let playerName = '';
        let xp = 0;
        let completedBlocks = [];
        let currentBlockId = null;
        let currentQuestionIdx = 0;
        let reportData = {};
        let feedback = null; // null, 'correct', 'wrong'
        let xpPopup = null;
        let isProcessing = false;

        // --- FUNÇÕES UTILITÁRIAS ---
        function getCurrentRank() {
            return [...RANKS].reverse().find(r => xp >= r.minXp) || RANKS[0];
        }

        // --- LÓGICA DO JOGO ---
        function startGame() {
            gameState = 'map';
            renderApp();
        }

        function startBlock(blockId) {
            currentBlockId = blockId;
            currentQuestionIdx = 0;
            feedback = null;
            gameState = 'playing';
            renderApp();
        }

        function handleAnswer(selectedIdx) {
            if (isProcessing) return;
            isProcessing = true;

            const block = GAME_DATA.find(b => b.id === currentBlockId);
            const question = block.questions[currentQuestionIdx];
            const isCorrect = (selectedIdx === question.correct);

            const xpEarned = isCorrect ? XP_CORRECT : XP_WRONG;
            xp = Math.max(0, xp + xpEarned);
            
            feedback = isCorrect ? 'correct' : 'wrong';
            xpPopup = { val: xpEarned > 0 ? `+${xpEarned}` : xpEarned, correct: isCorrect, correctIdx: question.correct };

            // Salva no relatório
            if (!reportData[currentBlockId]) {
                reportData[currentBlockId] = {};
            }
            reportData[currentBlockId][currentQuestionIdx] = { isCorrect, xpEarned };

            renderApp(); // Renderiza para mostrar as cores de feedback

            setTimeout(() => {
                feedback = null;
                xpPopup = null;
                isProcessing = false;

                if (currentQuestionIdx < block.questions.length - 1) {
                    currentQuestionIdx++;
                } else {
                    if (!completedBlocks.includes(currentBlockId)) {
                        completedBlocks.push(currentBlockId);
                    }
                    gameState = 'map';
                }
                renderApp();
            }, 1500);
        }

        function generateReport() {
            gameState = 'report';
            renderApp();
        }

        function resetGame() {
            gameState = 'intro';
            playerName = '';
            xp = 0;
            completedBlocks = [];
            reportData = {};
            currentBlockId = null;
            currentQuestionIdx = 0;
            renderApp();
        }

        // --- RENDERIZAÇÃO (UI) ---
        function renderHeader() {
            const headerContainer = document.getElementById('header-container');
            if (gameState === 'intro') {
                headerContainer.classList.add('hidden');
                return;
            }
            
            headerContainer.classList.remove('hidden');
            const currentRank = getCurrentRank();
            
            let popupHtml = '';
            if (xpPopup) {
                const color = xpPopup.correct ? 'text-green-500' : 'text-red-500';
                popupHtml = `<div class="font-bold animate-bounce ${color}">${xpPopup.val}</div>`;
            }

            headerContainer.innerHTML = `
                <div class="bg-white shadow-md p-4 flex justify-between items-center rounded-b-2xl mb-6 mx-4">
                    <div class="flex items-center gap-2">
                        <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold flex items-center gap-2">
                            <i data-lucide="star" class="text-yellow-300 w-5 h-5 fill-current"></i> 
                            ${xp} XP
                        </div>
                        ${popupHtml}
                    </div>
                    
                    <div class="text-xl font-black text-indigo-800 tracking-wider hidden sm:block">
                        GEOMETRIA<span class="text-pink-500">MASTER</span>
                    </div>

                    <div class="px-4 py-2 rounded-full font-bold flex items-center gap-2 border-2 ${currentRank.bg} ${currentRank.color} ${currentRank.border}">
                        <i data-lucide="trophy" class="w-5 h-5"></i>
                        ${currentRank.name}
                    </div>
                </div>
            `;
        }

        function getIntroView() {
            return `
                <div class="flex flex-col items-center justify-center min-h-[70vh] text-center px-4 pt-12">
                    <div class="relative mb-6">
                        <i data-lucide="trophy" class="text-yellow-400 drop-shadow-2xl w-32 h-32 fill-[#FDE047]"></i>
                        <i data-lucide="star" class="absolute -top-4 -right-4 text-pink-500 animate-spin-slow w-10 h-10 fill-current"></i>
                        <i data-lucide="star" class="absolute bottom-4 -left-6 text-blue-500 animate-pulse w-8 h-8 fill-current"></i>
                    </div>
                    
                    <h1 class="text-5xl md:text-6xl font-black text-white drop-shadow-lg mb-4 uppercase tracking-tight">
                        Geometria <br/><span class="text-yellow-300">Master</span>
                    </h1>
                    
                    <p class="text-xl text-indigo-100 max-w-2xl mb-6 bg-indigo-900/40 p-6 rounded-2xl backdrop-blur-sm border border-indigo-400/30">
                        Bem-vindo, aluno do 6º Ano! Prepare-se para uma jornada pelos Polígonos e Figuras Geométricas.
                        <br/><br/>
                        🎯 <strong>Missão:</strong> Conclua os 8 blocos de atividades.<br/>
                        ⭐ <strong>XP:</strong> Acertos dão +${XP_CORRECT} XP. Erros retiram ${Math.abs(XP_WRONG)} XP.<br/>
                        🏅 <strong>Evolução:</strong> Suba o seu ranking de <span class="text-orange-300">Bronze</span> até o lendário <span class="text-rose-400">Rubi</span>!
                    </p>

                    <input 
                        type="text" 
                        placeholder="Digite o seu nome (opcional)" 
                        value="${playerName}"
                        oninput="playerName = this.value"
                        class="mb-8 px-6 py-3 rounded-full text-lg text-indigo-900 font-bold focus:outline-none focus:ring-4 focus:ring-yellow-300 w-full max-w-sm text-center shadow-lg"
                    />

                    <button 
                        onclick="startGame()"
                        class="bg-gradient-to-b from-yellow-300 to-yellow-500 hover:from-yellow-400 hover:to-yellow-600 text-yellow-900 text-2xl font-black py-4 px-12 rounded-full shadow-xl hover:scale-105 transition-all flex items-center gap-3 border-4 border-yellow-200"
                    >
                        <i data-lucide="play" class="fill-current"></i>
                        INICIAR AVENTURA
                    </button>
                </div>
            `;
        }

        function getMapView() {
            const allCompleted = completedBlocks.length === GAME_DATA.length;
            
            let blocksHtml = GAME_DATA.map(block => {
                const isDone = completedBlocks.includes(block.id);
                const baseClasses = "relative group h-40 flex flex-col items-center justify-center rounded-3xl p-4 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-2xl border-4 cursor-pointer";
                const doneClasses = isDone ? "bg-indigo-900/80 border-green-400" : `bg-gradient-to-br ${block.color} border-white/20 hover:border-white`;
                
                const checkHtml = isDone ? `
                    <div class="absolute -top-3 -right-3 bg-green-500 text-white rounded-full p-1 shadow-lg border-2 border-white z-10">
                        <i data-lucide="check-circle" class="w-6 h-6 fill-current text-green-100"></i>
                    </div>
                ` : '';

                const statusHtml = isDone ? `
                    <div class="text-xs mt-2 bg-green-500/20 text-green-300 px-3 py-1 rounded-full border border-green-500/50">Concluído</div>
                ` : `<div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 rounded-2xl transition-opacity"></div>`;

                return `
                    <div onclick="startBlock('${block.id}')" class="${baseClasses} ${doneClasses}">
                        ${checkHtml}
                        <div class="text-5xl mb-3 ${isDone ? 'opacity-50 grayscale' : 'drop-shadow-lg group-hover:scale-110 transition-transform'}">${block.icon}</div>
                        <div class="font-bold text-center leading-tight ${isDone ? 'text-indigo-200' : 'text-white drop-shadow-md'}">${block.title}</div>
                        ${statusHtml}
                    </div>
                `;
            }).join('');

            const reportButton = allCompleted ? `
                <div class="mt-12 text-center animate-fade-in-up">
                    <button onclick="generateReport()" class="bg-gradient-to-r from-emerald-400 to-emerald-600 text-white text-xl font-bold py-4 px-8 rounded-full shadow-xl hover:scale-105 transition-all border-4 border-emerald-200 flex items-center gap-3 mx-auto">
                        <i data-lucide="file-text"></i> VER RELATÓRIO FINAL
                    </button>
                </div>
            ` : '';

            return `
                <div class="max-w-4xl mx-auto px-4 pb-12">
                    <div class="text-center mb-8">
                        <h2 class="text-3xl font-black text-white drop-shadow-md flex items-center justify-center gap-3">
                            <i data-lucide="map" class="text-yellow-300 w-8 h-8"></i>
                            Mapa de Missões
                        </h2>
                        <p class="text-indigo-100 mt-2">Escolha um bloco para treinar. Conclua os 8 para gerar o seu relatório final!</p>
                        <div class="mt-4 inline-block bg-white/20 backdrop-blur-sm px-6 py-2 rounded-full text-white font-bold border border-white/30">
                            Progresso: ${completedBlocks.length} / ${GAME_DATA.length}
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                        ${blocksHtml}
                    </div>
                    ${reportButton}
                </div>
            `;
        }

        function getPlayingView() {
            const block = GAME_DATA.find(b => b.id === currentBlockId);
            const question = block.questions[currentQuestionIdx];
            const progress = ((currentQuestionIdx + 1) / block.questions.length) * 100;

            let optionsHtml = question.options.map((opt, idx) => {
                let btnStateClass = "bg-slate-50 hover:bg-indigo-50 border-slate-200 hover:border-indigo-300 text-slate-700 cursor-pointer";
                let iconHtml = '<i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-400"></i>';

                if (feedback !== null) {
                    btnStateClass = "bg-slate-50 border-slate-200 text-slate-400 opacity-50 cursor-default"; // Default disabled state
                    if (idx === question.correct) {
                        btnStateClass = "bg-green-100 border-green-500 text-green-800 ring-4 ring-green-500/20";
                        iconHtml = '<i data-lucide="check-circle" class="text-green-600 animate-bounce w-7 h-7"></i>';
                    }
                }

                return `
                    <button onclick="handleAnswer(${idx})" ${feedback !== null ? 'disabled' : ''} class="w-full text-left p-5 rounded-2xl border-2 transition-all duration-200 font-semibold text-lg flex items-center justify-between group ${btnStateClass}">
                        <span>${opt}</span>
                        ${iconHtml}
                    </button>
                `;
            }).join('');

            let feedbackHtml = '';
            if (feedback === 'correct') {
                feedbackHtml = `
                    <div class="mt-6 p-4 bg-green-100 text-green-800 rounded-xl flex items-center justify-center gap-3 font-bold text-xl border-2 border-green-400 animate-pulse">
                        <i data-lucide="check-circle" class="w-8 h-8"></i> Excelente! +${XP_CORRECT} XP
                    </div>`;
            } else if (feedback === 'wrong') {
                feedbackHtml = `
                    <div class="mt-6 p-4 bg-red-100 text-red-800 rounded-xl flex items-center justify-center gap-3 font-bold text-xl border-2 border-red-400 animate-pulse">
                        <i data-lucide="x-circle" class="w-8 h-8"></i> Ops! A resposta certa era a verde. ${XP_WRONG} XP
                    </div>`;
            }

            return `
                <div class="max-w-3xl mx-auto px-4 pb-12">
                    <button onclick="startGame()" class="mb-4 flex items-center gap-2 text-indigo-100 hover:text-white transition-colors font-semibold">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i> Voltar ao Mapa
                    </button>

                    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-indigo-200">
                        <div class="bg-gradient-to-r ${block.color} p-6 text-white relative">
                            <div class="flex justify-between items-center mb-4">
                                <span class="bg-black/20 px-4 py-1 rounded-full font-bold text-sm tracking-wider uppercase">${block.title}</span>
                                <span class="font-bold text-lg">Questão ${currentQuestionIdx + 1} de ${block.questions.length}</span>
                            </div>
                            <div class="w-full bg-black/20 h-3 rounded-full overflow-hidden">
                                <div class="bg-white h-full transition-all duration-500 rounded-full" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="p-8">
                            <h3 class="text-2xl font-bold text-indigo-900 mb-8 leading-snug">${question.text}</h3>
                            <div class="flex flex-col gap-4">
                                ${optionsHtml}
                            </div>
                            ${feedbackHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function getReportView() {
            let totalQuestions = 56;
            let correctAnswers = 0;
            let wrongAnswers = 0;

            Object.values(reportData).forEach(blockQs => {
                Object.values(blockQs).forEach(q => {
                    if (q.isCorrect) correctAnswers++;
                    else wrongAnswers++;
                });
            });

            const accuracy = Math.round((correctAnswers / totalQuestions) * 100) || 0;
            const currentRank = getCurrentRank();

            let blocksDetailHtml = GAME_DATA.map(block => {
                const bData = reportData[block.id] || {};
                let bAcertos = 0;
                for (let i = 0; i < 7; i++) {
                    if (bData[i]?.isCorrect) bAcertos++;
                }

                let iconStatus = '';
                if (bAcertos === 7) iconStatus = '<i data-lucide="trophy" class="text-yellow-500 fill-current w-6 h-6"></i>';
                else if (bAcertos >= 4) iconStatus = '<i data-lucide="check-circle" class="text-green-500 w-6 h-6"></i>';
                else iconStatus = '<i data-lucide="alert-triangle" class="text-orange-400 w-6 h-6"></i>';

                return `
                    <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${block.icon}</span>
                            <span class="font-bold text-lg text-slate-700">${block.title}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="bg-white px-3 py-1 rounded-lg font-bold text-indigo-600 shadow-sm border border-slate-200">
                                ${bAcertos} / 7
                            </div>
                            ${iconStatus}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="max-w-4xl mx-auto px-4 pb-12">
                    <!-- CONTAINER DO PDF -->
                    <div id="conteudo-relatorio-pdf" class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 border-8 border-indigo-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-40 bg-gradient-to-r from-indigo-500 to-purple-600"></div>
                        
                        <div class="relative z-10 flex flex-col items-center">
                            <div class="w-32 h-32 rounded-full flex items-center justify-center border-8 bg-white ${currentRank.border} shadow-2xl mb-4">
                                <i data-lucide="award" class="w-16 h-16 ${currentRank.color}"></i>
                            </div>
                            
                            <h2 class="text-4xl font-black text-indigo-900 mb-1 text-center">Relatório de Desempenho</h2>
                            ${playerName ? `<p class="text-2xl font-bold text-indigo-600 mb-2">Aluno(a): ${playerName}</p>` : ''}
                            <p class="text-lg text-slate-500 mb-8">Avaliação de Polígonos - 6º Ano</p>

                            <div class="px-8 py-4 rounded-2xl ${currentRank.bg} border-4 ${currentRank.border} mb-12 flex flex-col items-center shadow-lg transform hover:scale-105 transition-transform">
                                <span class="text-lg font-bold ${currentRank.color} uppercase tracking-widest text-center">Rank Final Alcançado</span>
                                <span class="text-5xl font-black ${currentRank.color} text-center">${currentRank.name}</span>
                                <span class="mt-2 font-bold text-slate-700 flex items-center gap-2">
                                    <i data-lucide="star" class="text-yellow-500 fill-current w-5 h-5"></i>
                                    ${xp} XP Acumulados
                                </span>
                            </div>

                            <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                                <div class="bg-slate-50 p-6 rounded-2xl text-center border-2 border-slate-100">
                                    <div class="text-slate-400 font-bold mb-2 uppercase">Precisão</div>
                                    <div class="text-4xl font-black text-indigo-600">${accuracy}%</div>
                                </div>
                                <div class="bg-green-50 p-6 rounded-2xl text-center border-2 border-green-100">
                                    <div class="text-green-600/60 font-bold mb-2 uppercase">Acertos</div>
                                    <div class="text-4xl font-black text-green-600">${correctAnswers}</div>
                                </div>
                                <div class="bg-red-50 p-6 rounded-2xl text-center border-2 border-red-100">
                                    <div class="text-red-600/60 font-bold mb-2 uppercase">Erros</div>
                                    <div class="text-4xl font-black text-red-600">${wrongAnswers}</div>
                                </div>
                            </div>

                            <div class="w-full">
                                <h3 class="text-2xl font-bold text-indigo-900 mb-6 border-b-2 border-slate-100 pb-4">Detalhe por Bloco Geométrico</h3>
                                <div class="space-y-4">
                                    ${blocksDetailHtml}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BOTÕES DE AÇÃO -->
                    <div class="mt-8 flex flex-col md:flex-row justify-center gap-4">
                        <button onclick="downloadPDF(this)" class="bg-indigo-600 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-3 transform hover:scale-105">
                            <i data-lucide="download"></i> <span id="btn-pdf-text">Baixar Relatório em PDF</span>
                        </button>
                        
                        <button onclick="resetGame()" class="bg-white text-indigo-900 font-bold py-4 px-8 rounded-full shadow-lg hover:bg-slate-50 transition-all flex items-center justify-center gap-3 border-2 border-indigo-100">
                            <i data-lucide="rotate-ccw"></i> Jogar Novamente
                        </button>
                    </div>
                </div>
            `;
        }

        // --- PDF EXPORT ---
        function downloadPDF(btn) {
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            document.getElementById('btn-pdf-text').innerText = 'Gerando arquivo PDF...';

            const element = document.getElementById('conteudo-relatorio-pdf');
            
            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     `Relatorio_Geometria_${playerName || 'Aluno'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            window.html2pdf().set(opt).from(element).save().then(() => {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                document.getElementById('btn-pdf-text').innerText = 'Baixar Relatório em PDF';
            });
        }

        // --- RENDERIZAÇÃO PRINCIPAL ---
        function renderApp() {
            renderHeader();
            
            const appContainer = document.getElementById('app-container');
            
            if (gameState === 'intro') appContainer.innerHTML = getIntroView();
            else if (gameState === 'map') appContainer.innerHTML = getMapView();
            else if (gameState === 'playing') appContainer.innerHTML = getPlayingView();
            else if (gameState === 'report') appContainer.innerHTML = getReportView();

            // Atualizar os ícones Lucide recém-injetados no DOM
            lucide.createIcons();
        }

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            renderApp();
        };

    </script>
</body>
</html>
